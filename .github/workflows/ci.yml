name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      record_goldens:
        description: >-
          Re-record the reference images on this runner image and upload them
          as an artifact instead of verifying them. Commit the artifact, then
          let an ordinary run verify it.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every push and pull request. Unit and Robolectric/Roborazzi screenshot
  # tests, the design source lock, both generators in --check mode, the public
  # API and raw ABI dumps, the hygiene script, and the source-line limit.
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: gradle/actions/setup-gradle@v6

      # The reference images are rendered by the JVM harness, so they are
      # pinned to the Robolectric configuration AND to the toolchain that drew
      # them. A machine whose fonts or graphics stack differ from the recording
      # machine's produces a diff that reads as a chrome regression. Record on
      # this runner, commit the artifact, and every later run compares like
      # with like. Treat a runner-image bump as the signal to re-record.
      - name: Record the reference images
        if: inputs.record_goldens
        run: ./gradlew recordRoborazziDebug
      - uses: actions/upload-artifact@v4
        if: always() && inputs.record_goldens
        with:
          name: reference-images
          path: seatlayer-compose/src/test/snapshots
          if-no-files-found: error

      - name: Run the fast gate
        if: ${{ !inputs.record_goldens }}
        run: ./gradlew checkFast

  # Tags and manual runs only. Lint, both Maven publications, the benchmark and
  # sample assemblies, and the external consumer builds on the oldest and
  # current supported toolchains. Together with `check` this is `validate`, the
  # gate the publish workflow runs in full before it deploys to Maven Central.
  release-gate:
    name: validateRelease
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew validateRelease
